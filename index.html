<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PythonOS - Centro de Downloads</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #121214;
      color: #e1e1e6;
      margin: 0;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      max-width: 700px;
      width: 100%;
    }
    h1 {
      color: #00d26a;
      text-align: center;
      margin-bottom: 0.5rem;
    }
    p.subtitle {
      text-align: center;
      color: #a8a8b3;
      margin-bottom: 2rem;
    }
    /* Barra de pesquisa */
    .search-box {
      width: 100%;
      padding: 0.8rem 1.2rem;
      font-size: 1rem;
      border-radius: 8px;
      border: 1px solid #29292e;
      background-color: #202024;
      color: #fff;
      margin-bottom: 1.5rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-box:focus {
      border-color: #00d26a;
    }
    /* Lista de ficheiros */
    .file-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .file-card {
      background-color: #202024;
      border: 1px solid #29292e;
      padding: 1.2rem;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: transform 0.2s, border-color 0.2s;
    }
    .file-card:hover {
      transform: translateY(-2px);
      border-color: #00d26a;
    }
    .file-info {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }
    .file-name {
      font-weight: bold;
      font-size: 1.1rem;
      color: #fff;
    }
    .file-badge {
      font-size: 0.8rem;
      background-color: #29292e;
      color: #00d26a;
      padding: 0.2rem 0.6rem;
      border-radius: 12px;
      width: fit-content;
    }
    .btn-download {
      background-color: #00d26a;
      color: #09090a;
      text-decoration: none;
      font-weight: bold;
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      transition: background-color 0.2s;
    }
    .btn-download:hover {
      background-color: #00b359;
    }
    .no-results {
      text-align: center;
      color: #737380;
      margin-top: 2rem;
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🐍 PythonOS - Downloads</h1>
    <p class="subtitle">Baixe as versões estáveis dos scripts do sistema</p>

    <!-- Campo de Pesquisa -->
    <input 
      type="text" 
      id="searchInput" 
      class="search-box" 
      placeholder="Pesquisar por versão ou ficheiro (ex: 1.0.0, PyGUI)..."
      onkeyup="filtrarVersoes()"
    >

    <!-- Lista de Downloads -->
    <div class="file-list" id="fileList">

      <!-- Item 1: PyGUI_1.0.0.py dentro da pasta versions -->
      <div class="file-card" data-name="pygui_1.0.0.py 1.0.0 pygui">
        <div class="file-info">
          <span class="file-name">PyGUI_1.0.0.py</span>
          <span class="file-badge">Versão 1.0.0</span>
        </div>
        <a href="versions/PyGUI_1.0.0.py" download class="btn-download">Baixar .py</a>
      </div>

      <!-- Item 2: pythonOS_1.0.0.py dentro da pasta versions -->
      <div class="file-card" data-name="pythonos_1.0.0.py 1.0.0 pythonos">
        <div class="file-info">
          <span class="file-name">pythonOS_1.0.0.py</span>
          <span class="file-badge">Versão 1.0.0</span>
        </div>
        <a href="versions/pythonOS_1.0.0.py" download class="btn-download">Baixar .py</a>
      </div>

    </div>

    <div class="no-results" id="noResults">
      Nenhuma versão encontrada para a sua pesquisa.
    </div>
  </div>

  <script>
    function filtrarVersoes() {
      const input = document.getElementById('searchInput').value.toLowerCase();
      const cards = document.querySelectorAll('.file-card');
      const noResults = document.getElementById('noResults');
      let visiveis = 0;

      cards.forEach(card => {
        const nome = card.getAttribute('data-name');
        if (nome.includes(input)) {
          card.style.display = 'flex';
          visiveis++;
        } else {
          card.style.display = 'none';
        }
      });

      if (visiveis === 0) {
        noResults.style.display = 'block';
      } else {
        noResults.style.display = 'none';
      }
    }
  </script>

</body>
</html>
